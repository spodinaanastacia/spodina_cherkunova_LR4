syntax = "proto3";

package payment;

// Сервис, который будет работать на стороне Насти Сподиной
service PaymentService {
  rpc CheckPaymentStatus (PaymentRequest) returns (PaymentResponse);
}

// Запрос, который будет отправлять Настя Черкунова
message PaymentRequest {
  string order_id = 1;
  double amount = 2;
  bool simulate_failure = 3; // Флаг для симуляции аварии
}

// Ответ, который возвращает сервер
message PaymentResponse {
  string transaction_id = 1;
  string status = 2; // SUCCESS, FAILED, PROCESSING
  string message = 3;
}
