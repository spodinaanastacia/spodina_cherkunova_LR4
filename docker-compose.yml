version: '3.8'

services:
  # 1. Сервис Discovery (Consul)
  consul:
    image: hashicorp/consul:1.15
    container_name: consul
    ports:
      - "8500:8500"
    command: "agent -dev -client=0.0.0.0"

  # 2. Брокер сообщений (RabbitMQ)
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq_br
    ports:
      - "5672:5672"   # Порт взаимодействия кода с брокером
      - "15672:15672" # Порт веб-админки
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  # 3. Сервис авторизации
  auth:
    build: ./auth_service
    dns: 8.8.8.8
    container_name: auth
    environment:
      - PORT=8000
      - INSTANCE_NAME=auth-service
      - CONSUL_URL=http://consul:8500/v1/agent/service
    depends_on:
      - consul

  # 4. Первый экземпляр каталога
  catalog-1:
    build: ./catalog_service
    dns: 8.8.8.8
    container_name: catalog-1
    environment:
      - PORT=8001
      - INSTANCE_NAME=catalog-1
      - CONSUL_URL=http://consul:8500/v1/agent/service
    depends_on:
      - consul

  # 5. Второй экземпляр каталога
  catalog-2:
    build: ./catalog_service
    dns: 8.8.8.8
    container_name: catalog-2
    environment:
      - PORT=8002
      - INSTANCE_NAME=catalog-2
      - CONSUL_URL=http://consul:8500/v1/agent/service
    depends_on:
      - consul

  # 6. API Шлюз (Анастасия Черкунова: gRPC-клиент + Circuit Breaker)
  graphql_gateway:
    build: ./graphql_gateway
    dns: 8.8.8.8
    container_name: graphql_gateway
    environment:
      - PORT=8003
      - INSTANCE_NAME=graphql-gateway
      - CONSUL_URL=http://consul:8500/v1/agent/service
    volumes:
      - ./graphql_gateway:/app
    depends_on:
      - consul
      - payment_service

  # 7. Сервис оплаты (Анастасия Сподина: gRPC-сервер с симуляцией сбоя)
  payment_service:
    build: ./payment_service
    dns: 8.8.8.8
    container_name: payment_service
    ports:
      - "50051:50051" # Пробрасываем порт gRPC взаимодействия наружу/внутри
    environment:
      - PORT=50051
      - INSTANCE_NAME=payment-service
      - CONSUL_URL=http://consul:8500/v1/agent/service
    volumes:
      - ./payment_service:/app
    depends_on:
      - consul

  # 8. Сервис уведомлений
  notification_service:
    build: ./notification_service
    dns: 8.8.8.8
    container_name: notification_service
    environment:
      - PORT=8004
      - INSTANCE_NAME=notification-service
      - CONSUL_URL=http://consul:8500/v1/agent/service
    volumes:
      - ./notification_service:/app
    depends_on:
      - consul
      - rabbitmq

  # 9. Балансировщик Nginx (Входная точка)
  nginx:
    image: nginx:alpine
    container_name: nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - auth
      - catalog-1
      - catalog-2
      - graphql_gateway
